name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: miao
          POSTGRES_PASSWORD: miao
          POSTGRES_DB: miao_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://miao:miao@localhost:5432/miao_test
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      # test_cors_allows_production_alias 依賴精確白名單放行 production 別名
      # （隨機後綴、regex 涵蓋不到），secret 值須含該別名
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.19"
      - run: uv sync --frozen
      - name: Pytest
        run: uv run pytest -q
      - name: Mypy
        run: uv run mypy app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - run: npm ci
      - name: Vitest
        run: npm test
      - run: npm run build
