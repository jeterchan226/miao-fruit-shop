name: Close issues and generate status on dev merge

# GitHub 只在 PR 合併進預設分支(master)時處理 "Closes #NN"。
# PR 一律發到 dev,所以合併進 dev 時由這裡關閉 PR 內文引用的 issue。
# 關閉後重新產生進度快照,已解決的「留待之後」才會在同一輪消失。
on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  issues: write

jobs:
  close-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            // 只認獨立成行的 "Closes #NN":段落內文、code span、code block 內只是提到,不算關閉指令。
            const pattern = /^[ \t]*(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)[ \t]+#(\d+)[ \t]*$/gim;
            const body = (pr.body || '').replace(/\r\n/g, '\n').replace(/^(```|~~~)[\s\S]*?^\1[ \t]*$/gm, '');
            const numbers = new Set();
            for (const m of body.matchAll(pattern)) numbers.add(Number(m[1]));
            for (const issue_number of numbers) {
              const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number });
              if (issue.pull_request || issue.state === 'closed') continue;
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body: `由 #${pr.number} 合併進 \`dev\` 後關閉。`,
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`closed #${issue_number}`);
            }

  generate-status:
    needs: close-issues
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    # 序列化連續合併;排隊中被取代的 run 不影響結果,後一個 run 讀到的 dev 已包含前者。
    concurrency:
      group: generate-status
      cancel-in-progress: false
    steps:
      # 要最新的 dev,不是觸發事件當下的 commit。
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generate STATUS.md
        run: python3 scripts/generate_status.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/progress/STATUS.md; then
            echo "STATUS.md unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/progress/STATUS.md
          git commit -m "docs: regenerate progress status"
          git push
