name: Close issues on dev merge

# GitHub 只在 PR 合併進預設分支(master)時處理 "Closes #NN"。
# PR 一律發到 dev,所以合併進 dev 時由這裡關閉 PR 內文引用的 issue。
on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  issues: write

jobs:
  close-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const pattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi;
            const numbers = new Set();
            for (const m of (pr.body || '').matchAll(pattern)) numbers.add(Number(m[1]));
            for (const issue_number of numbers) {
              const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number });
              if (issue.pull_request || issue.state === 'closed') continue;
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body: `由 #${pr.number} 合併進 \`dev\` 後關閉。`,
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`closed #${issue_number}`);
            }
